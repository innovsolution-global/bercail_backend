name: Backend CI

# Intégration continue du backend Le Bercail.
# Les tests e2e tournent contre un vrai PostgreSQL et un vrai Redis :
# une suite qui passe ici décrit le comportement réel de l'API.

on:
  push:
    branches: [main, master, develop]
    paths: ['backend/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: backend

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test -- --ci --coverage

      - name: Publier la couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage/
          retention-days: 7

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bercail
          POSTGRES_PASSWORD: bercail
          POSTGRES_DB: bercail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bercail"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bercail:bercail@localhost:5432/bercail_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-au-moins-32-caracteres-ok
      JWT_REFRESH_SECRET: ci-refresh-secret-au-moins-32-caracteres-ok
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer le schéma
        run: npx prisma migrate deploy || npx prisma db push

      - name: Semer les données de démonstration
        run: npm run seed

      - name: Tests e2e
        run: npm run test:e2e

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: le-bercail-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
